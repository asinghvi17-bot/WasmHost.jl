name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.julia-version }}, ${{ matrix.runtime == 'node' && format('node {0}', matrix.node-version) || 'bun' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12', '1.13']
        # the JavaScript adapter's tests (test/runtests.jl) in Node and in Bun: WASM_RUNTIME
        runtime: [node, bun]
        # (the Node versions: 24 is the minimum, JSPI on without a flag; the axis means nothing to Bun)
        node-version: ['24', '26']
        exclude:
          - runtime: bun
            node-version: '26'
    env:
      WASM_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: The adapter's modules load (${{ matrix.runtime }})
        run: |
          if [ "${{ matrix.runtime }}" = node ]; then
            for f in js/common/*.mjs js/node/*.mjs js/browser/*.mjs; do node --check "$f" || exit 1; done
          else
            for f in js/common/*.mjs js/node/*.mjs js/browser/*.mjs; do bun -e "await import('$PWD/$f')" || exit 1; done
          fi
      - uses: julia-actions/julia-runtest@v1

  # End to end (test/e2e/e2e.jl): programs compiled by WasmCodegen (wasm-opt -O3, its default), run with the adapter
  # in Node, in Bun and in Playwright's headless Chromium (the browser adapter, js/browser/), compared with the same
  # programs run natively. The decompress part needs WasmCodegen's julia_regex host extension, which WasmCodegen no
  # longer has: it is not run here (on any runtime); in Chromium, `decompress` checks the adapter's decompression alone.
  e2e:
    name: e2e ${{ matrix.part }}, ${{ matrix.runtime == 'node' && format('node {0}', matrix.node-version) || matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # (page: WasmHost.Page for WASI, both directions, and for JavaScript, sending only; not in chromium)
        part: [spool, import, page]
        runtime: [node, bun, chromium]
        node-version: ['24', '26']
        exclude:
          - runtime: bun
            node-version: '26'
          # (Chromium is driven by Node 24)
          - runtime: chromium
            node-version: '26'
          - runtime: chromium
            part: page
        include:
          - part: decompress
            runtime: chromium
            node-version: '24'
          # (Julia tasks and the host's batch, `verify = :error`: both transports, `all`'s order)
          - part: concurrent
            runtime: node
            node-version: '24'
          - part: concurrent
            runtime: node
            node-version: '26'
          - part: batch
            runtime: node
            node-version: '24'
          - part: batch
            runtime: node
            node-version: '26'
          # (WasmHost.Bridge: brprog.jl's cases, Node's adapter and the browser's)
          - part: bridge
            runtime: node
            node-version: '24'
          - part: bridge
            runtime: node
            node-version: '26'
          - part: bridge
            runtime: chromium
            node-version: '24'
    env:
      WASM_RUNTIME: ${{ matrix.runtime }}
      # (a run skipped for an engine gap fails the job: none is documented for Node 24, Node 26 or Bun 1.4)
      E2E_ALLOW_SKIP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          # (feat/task-park-host-wait: Julia tasks on julia_io, asyncmap typed on Julia 1.12 and 1.13; it includes
          # WasmCodegen#91, the bytes arguments of host imports WasmHost.Page needs)
          repository: asinghvi17-bot/WasmCodegen.jl
          ref: 8f2070a2ab33b53fbf403a58a5871aae494e40ee
          path: wcg
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.2'
      - uses: julia-actions/cache@v2
        with:
          cache-name: e2e-v1
      # (the e2e's server, native driver and module runner all run in WASM_RUNTIME; Chromium is driven by Node)
      - if: matrix.runtime == 'node' || matrix.runtime == 'chromium'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # (npm's cache, keyed on the e2e's lockfile: chromium only)
          cache: ${{ matrix.runtime == 'chromium' && 'npm' || '' }}
          cache-dependency-path: test/e2e/browser/package-lock.json
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      # (Playwright's browsers, keyed on the lockfile, which pins Playwright and so its Chromium; the system libraries
      # --with-deps installs aren't cached)
      - if: matrix.runtime == 'chromium'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/browser/package-lock.json') }}
      - if: matrix.runtime == 'chromium'
        name: Playwright and its headless Chromium
        working-directory: test/e2e/browser
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
      - name: e2e ${{ matrix.part }} in ${{ matrix.runtime }}${{ matrix.runtime == 'node' && format(' {0}', matrix.node-version) || '' }}
        run: |
          if [ "${{ matrix.part }}" = concurrent ] || [ "${{ matrix.part }}" = batch ]; then
            for t in spool import; do julia --startup-file=no test/e2e/e2e.jl wcg ${{ matrix.part }} $t || exit 1; done
          else
            julia --startup-file=no test/e2e/e2e.jl wcg ${{ matrix.part }}
          fi
